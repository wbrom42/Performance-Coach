<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0a0b10">
<!-- API base is same-origin when served from FastAPI's /static mount -->
<title>Performance Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0a0b10;
    min-height: 100vh; min-height: 100dvh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #e8eaf0;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  /* On a real iPhone we want the screen to fill the viewport, not sit inside
     a device-frame mockup. The IOSDevice wrapper still renders, but we
     stretch it to 100% so it acts as a transparent layout shell. */
  #app {
    width: 100vw;
    height: 100vh; height: 100dvh;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="/static/api.js"></script>
  <script type="text/babel" src="/static/ios-frame.jsx"></script>
  <script type="text/babel" src="/static/tweaks-panel.jsx"></script>
  <script type="text/babel" src="/static/data.jsx"></script>
  <script type="text/babel" src="/static/screens.jsx"></script>
  <script type="text/babel" src="/static/tests.jsx"></script>
  <script type="text/babel" src="/static/profile.jsx"></script>
  <script type="text/babel" src="/static/flags.jsx"></script>
  <!-- The original app.jsx mounts to #device-mount inside a desktop preview
       shell; for the production index we mount the same App to #app full-bleed. -->
  <script type="text/babel">
    // Shim: alias #app → #device-mount so app.jsx's existing mount call works.
    const appEl = document.getElementById('app');
    appEl.id = 'device-mount';
  </script>
  <script type="text/babel" src="/static/app.jsx"></script>
</body>
</html>
